# Netlify picks these up automatically. Vercel detects Astro on its own and
# needs no config file.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits a real 404.html; this makes Netlify serve it with the right status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
